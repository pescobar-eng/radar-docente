name: Radar Docente - actualización diaria

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Actualizar Radar Docente
        run: |
          curl -X POST \
            --fail \
            --max-time 300 \
            https://radar-docente-production.up.railway.app/api/actualizar
