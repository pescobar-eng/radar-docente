name: Radar Docente

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Actualizar Radar Docente
        shell: bash
        run: |
          echo "Consultando Radar Docente..."

          set +e

          curl \
            --silent \
            --show-error \
            --output /tmp/radar_response.txt \
            --write-out "HTTP_STATUS=%{http_code}\n" \
            --request POST \
            --max-time 300 \
            https://radar-docente-production.up.railway.app/api/actualizar \
            > /tmp/radar_status.txt

          CURL_CODE=$?

          cat /tmp/radar_status.txt

          echo "--- Respuesta del servidor ---"
          cat /tmp/radar_response.txt
          echo "-----------------------------"

          if [ "$CURL_CODE" -ne 0 ]; then
            echo "curl falló con código $CURL_CODE"
            exit "$CURL_CODE"
          fi

          HTTP_CODE=$(sed -n 's/HTTP_STATUS=//p' /tmp/radar_status.txt)

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "El servidor devolvió HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Radar actualizado correctamente."
